apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: child
  namespace: argocd-e2e
spec:
  project: default
  source:
    repoURL: https://github.com/argoproj/argo-cd.git
    targetRevision: HEAD
    path: suspend
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd-e2e
  syncPolicy:
    automated:
      selfHeal: true
