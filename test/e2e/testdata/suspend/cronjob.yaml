apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: main
              command: ["true"]
              image: quay.io/argoprojlabs/argocd-e2e-container:0.1
              imagePullPolicy: IfNotPresent
