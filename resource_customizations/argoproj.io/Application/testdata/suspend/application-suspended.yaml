apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: example
  namespace: default
  annotations:
    argocd.argoproj.io/suspend: "true"
spec:
  project: default
  source:
    repoURL: https://github.com/argoproj/argocd-example-apps.git
    path: guestbook
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: guestbook
