apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: example
  namespace: default
spec:
  selector:
    matchLabels:
      app: example
  strategy:
    canary:
      steps:
      - setWeight: 50
  template:
    metadata:
      labels:
        app: example
    spec:
      containers:
      - name: example
        image: quay.io/argoprojlabs/argocd-e2e-container:0.2
