apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: example
  namespace: default
spec:
  replicas: 0
  selector:
    matchLabels:
      app: example
  template:
    metadata:
      labels:
        app: example
    spec:
      containers:
      - name: example
        image: quay.io/argoprojlabs/argocd-e2e-container:0.2
