apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook-ui
  namespace: default
  labels:
    app: guestbook-ui
spec:
  replicas: 0
  selector:
    matchLabels:
      app: guestbook-ui
  template:
    metadata:
      labels:
        app: guestbook-ui
    spec:
      containers:
      - name: guestbook-ui
        image: quay.io/argoprojlabs/argocd-e2e-container:0.2
        resources: {}
