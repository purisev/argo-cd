apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: example
  namespace: default
  annotations:
    example.com/owner: "team"
    autoscaling.keda.sh/paused-replicas: "0"
    autoscaling.keda.sh/paused: "true"
spec:
  scaleTargetRef:
    name: example
  minReplicaCount: 1
  triggers:
  - type: cpu
    metricType: Utilization
    metadata:
      value: "60"
